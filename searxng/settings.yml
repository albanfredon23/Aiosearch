# SearXNG interne : joignable uniquement par le moteur AIOTECH (réseau Docker interne), format JSON activé.
# La clé de session est générée au premier démarrage (volume des secrets) et passée par SEARXNG_SECRET.
use_default_settings: true

general:
  instance_name: "AIOTECH SearXNG"
  enable_metrics: false

server:
  secret_key: "remplacee-au-demarrage-par-SEARXNG_SECRET"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
  pool_connections: 50
  pool_maxsize: 10

valkey:
  url: false
