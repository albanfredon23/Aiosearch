name: Vitrine (GitHub Pages)

# Publie la vitrine statique (landing 3D, chiffres, démo rejouée) à chaque mise à jour de main.
# Réglage unique du dépôt : Settings > Pages > Build and deployment > Source : GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construire la vitrine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Enregistrer les étapes réelles du moteur pour la démo
        run: |
          pip install ./engine
          python -m aiotech.showcase web/public/demo
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Construire
        working-directory: web
        env:
          VITE_DEMO: "1"
          AIOTECH_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Publier sur GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
