# AIOTECH Search : seul le service web (nginx) publie un port.
#   docker compose up -d            moteur, interface 3D, SearXNG, Redis
#   docker compose run --rm bench   benchmark FEVER et HotpotQA (CPU, hors ligne, une commande)
#   docker compose --profile graph up -d   ajoute Neo4j (renseigner AIOTECH_NEO4J_URL dans .env)
name: aiosearch

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-engine-image: &engine-image
  image: aiosearch-engine:local
  build:
    context: ./engine
    target: runtime

services:
  keygen:
    <<: [*engine-image, *hardening]
    command: ["python", "-m", "aiotech.keygen", "/run/aiotech"]
    volumes:
      - secrets:/run/aiotech
    network_mode: none
    restart: "no"

  engine:
    <<: [*engine-image, *hardening]
    env_file:
      - path: .env
        required: false
    environment:
      AIOTECH_WEB_API_KEY_FILE: /run/aiotech/web_key
      AIOTECH_REDIS_URL: redis://redis:6379/0
      AIOTECH_SEARXNG_URL: http://searxng:8080
      AIOTECH_CORPUS_DIR: /data/corpus
      AIOTECH_DOCS_DIR: /data/docs
    volumes:
      - secrets:/run/aiotech:ro
      - corpus:/data/corpus
    tmpfs:
      - /tmp:size=64m
    depends_on:
      keygen:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    networks: [internal, egress]
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256

  web:
    <<: *hardening
    image: aiosearch-web:local
    build:
      context: ./web
    ports:
      - "${AIOTECH_HTTP_PORT:-8080}:8080"
    volumes:
      - secrets:/run/aiotech:ro
    tmpfs:
      - /tmp:size=32m,uid=101,gid=101
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101
    depends_on:
      engine:
        condition: service_healthy
    networks: [internal, public]
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128

  searxng:
    <<: *hardening
    image: searxng/searxng:2026.10.4-d48c4b555
    user: "977:977"
    entrypoint: ["/bin/sh", "-c", "SEARXNG_SECRET=\"$$(cat /run/aiotech/searxng_secret)\" exec /usr/local/searxng/entrypoint.sh"]
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      GRANIAN_HOST: 0.0.0.0
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - secrets:/run/aiotech:ro
    tmpfs:
      - /var/cache/searxng:size=64m,uid=977,gid=977
      - /tmp:size=32m,uid=977,gid=977
    depends_on:
      keygen:
        condition: service_completed_successfully
    networks: [internal, egress]
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    user: "999:1000"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb",
              "--maxmemory-policy", "allkeys-lru", "--protected-mode", "no"]
    tmpfs:
      - /data:size=16m,uid=999,gid=1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]
    restart: unless-stopped
    mem_limit: 192m

  neo4j:
    image: neo4j:5.26-community
    profiles: [graph]
    environment:
      NEO4J_AUTH: neo4j/${AIOTECH_NEO4J_PASSWORD:-aiotech-graph-change-me}
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j:/data
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    restart: unless-stopped

  bench:
    <<: [*engine-image, *hardening]
    profiles: [bench]
    entrypoint: ["python", "-m", "aiotech.bench"]
    command: []
    env_file:
      - path: .env
        required: false
    environment:
      AIOTECH_BENCH_OUT: /out
    volumes:
      - ./bench-results:/out
    tmpfs:
      - /tmp:size=64m
    networks: [egress]
    restart: "no"

networks:
  public: {}
  egress: {}
  internal:
    internal: true

volumes:
  secrets: {}
  corpus: {}
  neo4j: {}
