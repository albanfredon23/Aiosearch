[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiotech-search"
version = "1.0.0"
description = "AIOTECH Search : moteur de recherche agentique à trajectoires vérifiées (ARG, TAP, SCG, Gödel)"
requires-python = ">=3.11"
authors = [{ name = "Alban" }]
dependencies = [
    "numpy>=2.0,<3",
    "pydantic>=2.8,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "anthropic>=1.11,<2",
    "redis>=5.0,<9",
    "neo4j>=5.20,<7",
]

[project.optional-dependencies]
providers = ["litellm>=1.50,<2"]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fakeredis>=2.20", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["aiotech*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 132
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "TRY004"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.setuptools.package-data]
"aiotech.data" = ["*.json"]
"aiotech.bench.data" = ["*.jsonl.gz", "*.md"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
